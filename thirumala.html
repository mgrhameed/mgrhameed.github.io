  <style type="text/tailwindcss">
    @theme {
      --font-sans: "DM Sans", sans-serif;
      --font-display: "Manrope", sans-serif;
      --color-pine: #164f52;
      --color-pine-dark: #0d3235;
      --color-sage: #cddfd2;
      --color-sage-soft: #edf5ef;
      --color-saffron: #d9893d;
      --color-sand: #f3eadc;
      --color-cream: #fbf8f2;
      --color-ink: #253b3d;
    }
  </style>
  <style>
    :root { --pine:#164f52; --pine-dark:#0d3235; --sage:#cddfd2; --sage-soft:#edf5ef; --saffron:#d9893d; --sand:#f3eadc; --cream:#fbf8f2; --ink:#253b3d; }
    * { box-sizing:border-box; }
    html { scroll-behavior:auto; }
    body { margin:0; overflow-x:hidden; background:var(--cream); color:var(--ink); font-family:"DM Sans",sans-serif; }
    h1,h2,h3,h4,.font-display { font-family:"Manrope",sans-serif; letter-spacing:-.035em; }
    button,a,input,select,textarea { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; }
    ::selection { background:#bdd9ca; color:#0d3235; }
    .noise { position:fixed; inset:0; z-index:100; pointer-events:none; opacity:.03; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E"); }
    .soft-shadow { box-shadow:0 24px 70px rgba(13,50,53,.13); }
    .card-shadow { box-shadow:0 12px 34px rgba(13,50,53,.08); }
    .text-balance { text-wrap:balance; }
    .page-grid { background-image:linear-gradient(rgba(22,79,82,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(22,79,82,.05) 1px,transparent 1px); background-size:54px 54px; }
    .nav-link { position:relative; }
    .nav-link::after { content:""; position:absolute; left:0; right:100%; bottom:-8px; height:2px; background:var(--saffron); transition:right .25s ease; }
    .nav-link:hover::after,.nav-link.active::after { right:0; }
    .hero-shape { border-radius:47% 53% 58% 42% / 44% 38% 62% 56%; }
    .catalog-card { transition:transform .35s ease,box-shadow .35s ease,border-color .35s ease; }
    .catalog-card:hover { transform:translateY(-6px); border-color:rgba(22,79,82,.28); box-shadow:0 22px 55px rgba(13,50,53,.13); }
    .photo-zoom { transition:transform .75s cubic-bezier(.2,.8,.2,1); }
    .photo-card:hover .photo-zoom { transform:scale(1.055); }
    .float-a { animation:floatA 7s ease-in-out infinite; }
    .float-b { animation:floatB 8s ease-in-out infinite; }
    @keyframes floatA { 0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-13px) rotate(2deg)} }
    @keyframes floatB { 0%,100%{transform:translateY(0) rotate(2deg)}50%{transform:translateY(11px) rotate(-2deg)} }
    .marquee-track { min-width:max-content; animation:marquee 27s linear infinite; }
    @keyframes marquee { to{transform:translateX(-50%)} }
    .input-field { width:100%; border:1px solid #d6e1dc; background:#fff; border-radius:14px; padding:13px 15px; color:var(--ink); outline:none; transition:border-color .2s,box-shadow .2s; }
    .input-field:focus { border-color:var(--pine); box-shadow:0 0 0 4px rgba(22,79,82,.1); }
    .input-field::placeholder { color:#91a5a1; }
    .toast-in { animation:toastIn .35s cubic-bezier(.2,.8,.2,1); }
    @keyframes toastIn { from{opacity:0;transform:translate(-50%,18px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)} }
    .success-pop { animation:successPop .55s cubic-bezier(.2,1.5,.3,1); }
    @keyframes successPop { from{opacity:0;transform:scale(.3) rotate(-10deg)}to{opacity:1;transform:scale(1) rotate(0)} }
    .hide-scrollbar::-webkit-scrollbar { display:none; }
    .hide-scrollbar { scrollbar-width:none; }
    .hero-interactive { --mx:70%; --my:45%; isolation:isolate; }
    .hero-aura { position:absolute; z-index:1; left:var(--mx); top:var(--my); width:430px; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; opacity:0; pointer-events:none; background:radial-gradient(circle,rgba(22,79,82,.13),rgba(217,137,61,.09) 38%,transparent 70%); transition:opacity .3s; }
    .hero-pattern { position:absolute; inset:0; z-index:1; opacity:0; pointer-events:none; background-image:url("data:image/svg+xml,%3Csvg width='76' height='76' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M16 38h14M23 31v14' stroke='%23164f52' stroke-width='1.2' opacity='.55'/%3E%3Ccircle cx='61' cy='18' r='2.2' fill='%23d9893d' opacity='.7'/%3E%3Cpath d='M55 57c4-5 8-5 12 0' fill='none' stroke='%23164f52' stroke-width='1.1' opacity='.45'/%3E%3C/svg%3E"); -webkit-mask-image:radial-gradient(circle 270px at var(--mx) var(--my),#000 0%,rgba(0,0,0,.78) 45%,transparent 100%); mask-image:radial-gradient(circle 270px at var(--mx) var(--my),#000 0%,rgba(0,0,0,.78) 45%,transparent 100%); transition:opacity .3s; }
    .hero-interactive:hover .hero-aura { opacity:1; }
    .hero-interactive:hover .hero-pattern { opacity:.7; }
    @media print { header,footer,.no-print,.noise{display:none!important}.receipt-shell{box-shadow:none!important;border:0!important}.print-break{break-inside:avoid}body{background:white!important} }
    @media (hover:none),(pointer:coarse) { .hero-aura,.hero-pattern{display:none} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important} }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="noise"></div>

  <script type="text/babel">
    const { useState,useEffect } = React;
    gsap.registerPlugin(ScrollTrigger);

    const LOGO = "https://scontent.fhyd11-1.fna.fbcdn.net/v/t39.30808-1/607614573_122118541239058941_2334644062295160081_n.jpg?stp=dst-jpg_tt6&cstp=mx500x500&ctp=s200x200&_nc_cat=107&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=2d3e12&_nc_ohc=lJyHdS1E_rUQ7kNvwG7JHUD&_nc_oc=AdounW6nQpCGKcsYLLIUAguGDm37upOHfDskG9TP-NeUOmWtSowwP8UxoqEtsoundw2iDU7yHhmTEzgEsV59nrNA&_nc_zt=24&_nc_ht=scontent.fhyd11-1.fna&_nc_gid=bTI8r5LXTW0hVod2uCVsbg&_nc_ss=7b2a8&oh=00_AQG2C9dM_AU60qpm6Ipw08cJessZrxJDv7EipPUJLt3A8g&oe=6A95E339";
    const PHONE_1 = "8008655972", PHONE_2 = "7036559723";
    const ADDRESS = "Near AVR Homes, Prakash Nagar Road, Chinna Venkatagiri Cross Road, Prakash Nagar, Khammam - 507001, Telangana, India";
    const MAP_URL = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(ADDRESS);
    const LISTING_URL = "https://www.justdial.com/Khammam/Sri-Thirumala-Rehab-Center-Prakash-Nagar-Road-Prakash-Nagar/9999P8742-8742-251108105650-E9H1_BZDET";
    const FACEBOOK_URL = "https://www.facebook.com/p/Sri-Thirumala-Rehab-Center-61585831627185/";
    const images = {
      hero:"https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&w=1500&q=85",
      physio:"https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=1400&q=85",
      elderly:"https://images.unsplash.com/photo-1584515933487-779824d29309?auto=format&fit=crop&w=1400&q=85",
      care:"https://images.unsplash.com/photo-1576765608866-5b51046452be?auto=format&fit=crop&w=1400&q=85",
      room:"https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1400&q=85",
      movement:"https://images.unsplash.com/photo-1599058917212-d750089bc07e?auto=format&fit=crop&w=1400&q=85"
    };

    const packages = [
      {id:"pkg-stroke7",kind:"package",name:"Post-Stroke Recovery Stay",category:"Recovery packages",badge:"7-day program",unit:"package",price:34900,taxRate:0,image:images.elderly,desc:"A structured residential start for post-stroke and neurological recovery.",includes:["7 nights assisted room","Daily neurophysiotherapy","24/7 nursing support","Patient meal plan","Caregiver progress briefing"]},
      {id:"pkg-neuro14",kind:"package",name:"Comprehensive Neuro Rehab",category:"Recovery packages",badge:"14-day program",unit:"package",price:64900,taxRate:0,image:images.physio,desc:"A longer supervised program focused on mobility, function and confidence.",includes:["14 nights rehab stay","12 neurophysio sessions","Clinical physiotherapy","Nursing & bedside care","Meals and progress review"]},
      {id:"pkg-sciatica3",kind:"package",name:"Sciatica Relief Residential Plan",category:"Pain management",badge:"3-day program",unit:"package",price:13500,taxRate:0,image:images.movement,desc:"A short residential plan combining assessment, therapy and guided movement.",includes:["3 nights standard room","3 clinical physio sessions","Pain-management plan","Patient meals","Home exercise guidance"]},
      {id:"pkg-nursing5",kind:"package",name:"Supported Nursing Stay",category:"Nursing care",badge:"5-day program",unit:"package",price:16900,taxRate:0,image:images.care,desc:"Short-term inpatient nursing and bedside support in a homely environment.",includes:["5 nights standard room","24/7 nursing staff","Bedside assistance","Patient meals","Family update"]},
      {id:"pkg-psych7",kind:"package",name:"Psychosocial Recovery Week",category:"Psychosocial care",badge:"7-day program",unit:"package",price:28900,taxRate:0,image:images.hero,desc:"A supportive residential week combining routine, care and guided rehabilitation.",includes:["7 nights supervised stay","Psychosocial sessions","Nursing oversight","Daily meals","Discharge care plan"]}
    ];

    const products = [
      {id:"room-standard",kind:"room",name:"Standard Rehab Room",category:"Room stay",badge:"Per day",unit:"day",price:1800,taxRate:0,icon:"bed",desc:"Clean shared/standard recovery accommodation with routine nursing access.",features:["Daily housekeeping","Nursing call support","Patient-friendly setting"]},
      {id:"room-assisted",kind:"room",name:"Assisted Recovery Room",category:"Room stay",badge:"Per day",unit:"day",price:3200,taxRate:0,icon:"home",desc:"Enhanced room support for patients who require more bedside assistance.",features:["Assisted bedside care","Daily housekeeping","Caregiver updates"]},
      {id:"room-private",kind:"room",name:"Private Recovery Suite",category:"Room stay",badge:"Per day · taxable*",unit:"day",price:5600,taxRate:5,icon:"spark",desc:"Private accommodation for a quieter, more personal recovery experience.",features:["Private room","Visitor seating","Enhanced privacy"]},
      {id:"therapy-neuro",kind:"service",name:"Neurophysiotherapy Session",category:"Therapy",badge:"Per session",unit:"session",price:1200,taxRate:0,icon:"brain",desc:"Supervised neurological rehabilitation focused on functional recovery.",features:["Mobility work","Balance training","Progress notes"]},
      {id:"therapy-clinical",kind:"service",name:"Clinical Physiotherapy",category:"Therapy",badge:"Per session",unit:"session",price:800,taxRate:0,icon:"activity",desc:"Individual clinical physiotherapy based on assessment and recovery goals.",features:["Clinical assessment","Guided exercise","Home-care advice"]},
      {id:"therapy-sciatica",kind:"service",name:"Sciatica Pain Session",category:"Therapy",badge:"Per session",unit:"session",price:950,taxRate:0,icon:"spine",desc:"Focused pain-management and movement support for sciatica symptoms.",features:["Pain review","Mobility support","Exercise guidance"]},
      {id:"care-nursing",kind:"service",name:"Dedicated Nursing Support",category:"Care support",badge:"Per day",unit:"day",price:900,taxRate:0,icon:"shield",desc:"Additional scheduled nursing attention alongside routine facility care.",features:["Regular monitoring","Medication assistance","Care notes"]},
      {id:"care-attendant",kind:"service",name:"Medical Attendant Support",category:"Care support",badge:"Per day",unit:"day",price:750,taxRate:0,icon:"user",desc:"Bedside assistance for mobility, comfort and daily activities.",features:["Mobility assistance","Daily living support","Bedside presence"]},
      {id:"food-patient",kind:"food",name:"Patient Nutrition Plan",category:"Meals",badge:"Per day",unit:"day",price:350,taxRate:0,icon:"meal",desc:"Simple daily meal plan coordinated for the patient's stay.",features:["Breakfast","Lunch & dinner","Tea / light snack"]},
      {id:"food-attendant",kind:"food",name:"Attendant Meal Plan",category:"Meals",badge:"Per day · taxable*",unit:"day",price:250,taxRate:5,icon:"cup",desc:"Convenient daily meals for one accompanying family member.",features:["Three meals","On-site convenience","Daily selection"]},
      {id:"addon-linen",kind:"addon",name:"Extra Linen & Laundry",category:"Convenience",badge:"Per day · taxable*",unit:"day",price:300,taxRate:5,icon:"linen",desc:"Additional linen replacement and basic laundry convenience.",features:["Fresh linen","Basic patient laundry","Daily collection"]},
      {id:"addon-review",kind:"addon",name:"Extended Family Care Briefing",category:"Convenience",badge:"One time",unit:"briefing",price:600,taxRate:0,icon:"chat",desc:"A scheduled extended briefing on progress and continuing care needs.",features:["Progress overview","Care questions","Discharge guidance"]}
    ];

    const allCatalog = [...packages,...products];
    const reviews = [
      {name:"Munna",text:"Comprehensive care from skilled doctors and physiotherapists, with subsidy support mentioned.",time:"7 months ago"},
      {name:"Prashanthi Josh",text:"The team cares very well and the environment feels homely and pleasant.",time:"7 months ago"},
      {name:"Prathibha",text:"Good medical care, well-equipped facilities and a positive recovery environment.",time:"7 months ago"},
      {name:"Rayani Praneeth",text:"Care was described as reasonably priced and accessible.",time:"5 months ago"}
    ];

    const formatMoney = n => `₹${Math.round(n).toLocaleString("en-IN")}`;
    const unitLabel = (unit,qty) => unit==="package"?(qty===1?"package":"packages"):unit==="briefing"?(qty===1?"briefing":"briefings"):(qty===1?unit:`${unit}s`);

    function Logo({className="h-12 w-12"}) {
      const [failed,setFailed]=useState(false);
      return <span className={`relative grid shrink-0 place-items-center overflow-hidden rounded-2xl bg-pine ${className}`}>{!failed&&<img src={LOGO} onError={()=>setFailed(true)} alt="Sri Thirumala Rehab Center logo" className="absolute inset-0 h-full w-full object-cover"/>}<span className="font-display text-sm font-extrabold text-white">STR</span></span>;
    }

    function Icon({name,size=20,className="",strokeWidth=1.8}) {
      const p={
        arrow:<><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></>,menu:<path d="M4 7h16M4 12h16M4 17h16"/>,close:<path d="M18 6 6 18M6 6l12 12"/>,
        cart:<><circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/><path d="M3 4h2l2.3 11a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L21 8H6"/></>,
        clock:<><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></>,check:<path d="m5 12 4 4L19 6"/>,plus:<path d="M12 5v14M5 12h14"/>,minus:<path d="M5 12h14"/>,
        trash:<><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></>,search:<><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></>,
        pin:<><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></>,
        phone:<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.4 2.1L8 9.7a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.8.3 1.7.5 2.6.6a2 2 0 0 1 2 2.3Z"/>,
        shield:<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></>,
        heart:<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.9-8.6a5.5 5.5 0 0 0-.1-7.8Z"/>,
        star:<path d="m12 2 3 6 7 .9-5 4.8 1.3 6.8L12 17l-6.3 3.5L7 13.7 2 8.9 9 8z"/>,
        info:<><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></>,calendar:<><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></>,
        download:<><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 20h14"/></>,print:<><path d="M6 9V3h12v6M6 18H4V10h16v8h-2M7 14h10v7H7z"/></>,
        lock:<><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></>,user:<><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></>,
        mail:<><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></>,facebook:<><path d="M14 8h3V4h-3c-3 0-5 2-5 5v3H6v4h3v6h4v-6h3l1-4h-4V9c0-.6.4-1 1-1Z"/></>
      };
      return <svg aria-hidden="true" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">{p[name]}</svg>;
    }

    const symbols={bed:"▰",home:"⌂",spark:"✦",brain:"◉",activity:"⌁",spine:"〽",shield:"◇",user:"◡",meal:"◒",cup:"♨",linen:"≋",chat:"◌"};
    const getRoute=()=> (location.hash.replace(/^#\/?/,"")||"home").split("?")[0];
    const go=path=>{location.hash=`#/${path}`};
    function useRoute(){const [route,setRoute]=useState(getRoute);useEffect(()=>{const f=()=>setRoute(getRoute());addEventListener("hashchange",f);return()=>removeEventListener("hashchange",f)},[]);return route;}

    function Header({route,count}){
      const [open,setOpen]=useState(false);useEffect(()=>setOpen(false),[route]);
      const links=[["home","Home"],["packages","Packages"],["services","Services & add-ons"],["facility","Facility"],["about","About"],["contact","Contact"]];
      return <><TopBar/><header className="sticky top-0 z-50 border-b border-pine/10 bg-cream/90 backdrop-blur-xl"><div className="mx-auto flex h-[78px] max-w-[1440px] items-center justify-between px-5 sm:px-8 lg:px-12"><button onClick={()=>go("home")} className="flex items-center gap-3 text-left" aria-label="Sri Thirumala home"><Logo/><div><div className="font-display text-[16px] font-extrabold leading-tight text-pine-dark sm:text-[18px]">Sri Thirumala</div><div className="text-[8px] font-bold uppercase tracking-[.16em] text-pine/65 sm:text-[9px]">Rehab Center & Nursing Home</div></div></button><nav className="hidden items-center gap-7 xl:flex">{links.map(([p,l])=><button key={p} onClick={()=>go(p)} className={`nav-link text-[13px] font-semibold transition hover:text-pine ${route===p?"active text-pine":"text-ink/62"}`}>{l}</button>)}</nav><div className="flex items-center gap-2"><a href={`tel:+91${PHONE_1}`} className="hidden h-11 items-center gap-2 rounded-full border border-pine/15 px-4 text-xs font-bold text-pine transition hover:bg-sage-soft sm:flex"><Icon name="phone" size={15}/>Call now</a><button onClick={()=>go("cart")} className="relative grid h-11 w-11 place-items-center rounded-full bg-pine text-white transition hover:bg-pine-dark" aria-label={`Cart with ${count} items`}><Icon name="cart" size={19}/>{count>0&&<span className="absolute -right-1 -top-1 grid h-5 min-w-5 place-items-center rounded-full bg-saffron px-1 text-[10px] font-extrabold text-white ring-2 ring-cream">{count}</span>}</button><button onClick={()=>setOpen(v=>!v)} className="grid h-11 w-11 place-items-center rounded-full border border-pine/15 text-pine xl:hidden" aria-label="Toggle menu"><Icon name={open?"close":"menu"}/></button></div></div>{open&&<nav className="border-t border-pine/10 bg-cream px-5 py-4 xl:hidden">{links.map(([p,l])=><button key={p} onClick={()=>go(p)} className={`block w-full rounded-xl px-4 py-3 text-left text-sm font-bold ${route===p?"bg-sage-soft text-pine":"text-ink/70"}`}>{l}</button>)}</nav>}</header></>;
    }

    function RateNotice(){return <div className="border-b border-[#e6c99d] bg-[#fff6e7] px-5 py-3 text-center text-[11px] leading-5 text-[#765325]"><strong>Prototype pricing notice:</strong> displayed rates and GST flags are illustrative booking estimates because an official tariff was not provided. Final charges, subsidies and taxes must be confirmed by the centre.</div>}
    function PageHero({eyebrow,title,text}){return <section className="page-grid relative overflow-hidden border-b border-pine/10 bg-sage-soft/55 px-5 py-20 sm:px-8 sm:py-24 lg:px-12"><div className="absolute -right-24 -top-32 h-80 w-80 rounded-full bg-sand blur-3xl"></div><div className="page-enter relative mx-auto max-w-[1400px]"><Eyebrow>{eyebrow}</Eyebrow><h1 className="max-w-5xl text-balance text-4xl font-extrabold leading-[1.03] text-pine-dark sm:text-6xl lg:text-7xl">{title}</h1>{text&&<p className="mt-6 max-w-2xl text-base leading-7 text-ink/62 sm:text-lg">{text}</p>}</div></section>}

    function Hero(){
      const move=e=>{const r=e.currentTarget.getBoundingClientRect();gsap.to(e.currentTarget,{"--mx":`${e.clientX-r.left}px`,"--my":`${e.clientY-r.top}px`,duration:.35,ease:"power2.out",overwrite:"auto"})};
      return <section onMouseMove={move} className="hero-interactive page-grid relative overflow-hidden bg-sage-soft/55 px-5 pb-20 pt-12 sm:px-8 sm:pt-16 lg:px-12 lg:pb-28 lg:pt-20"><div className="hero-aura"></div><div className="hero-pattern"></div><div className="absolute left-[32%] top-0 h-[480px] w-[480px] rounded-full bg-sage/45 blur-[95px]"></div><div className="relative z-10 mx-auto grid max-w-[1400px] items-center gap-14 lg:grid-cols-[1.03fr_.97fr]"><div className="hero-copy"><Eyebrow>Recovery feels better together</Eyebrow><h1 className="text-balance text-[44px] font-extrabold leading-[.98] text-pine-dark sm:text-6xl lg:text-[76px]">From setback<br/>to <span className="text-saffron">stronger</span> steps.</h1><p className="mt-7 max-w-xl text-base leading-7 text-ink/62 sm:text-lg">Round-the-clock neurological rehabilitation, physiotherapy and nursing care in a clean, calm and genuinely homely setting in Khammam.</p><div className="mt-9 flex flex-wrap gap-3"><Button onClick={()=>go("packages")} className="group">Explore recovery packages <Icon name="arrow" size={18} className="transition group-hover:translate-x-1"/></Button><Button onClick={()=>go("contact")} variant="outline"><Icon name="calendar" size={17}/>Plan an admission</Button></div><div className="mt-10 flex flex-wrap items-center gap-x-8 gap-y-4 border-t border-pine/10 pt-7"><div><strong className="block font-display text-2xl font-extrabold text-pine-dark">5.0/5</strong><span className="text-xs font-semibold text-ink/45">10+ listing reviews</span></div><div className="h-10 w-px bg-pine/10"></div><div><strong className="block font-display text-2xl font-extrabold text-pine-dark">24 × 7</strong><span className="text-xs font-semibold text-ink/45">Nursing support</span></div><div className="hidden h-10 w-px bg-pine/10 sm:block"></div><div><strong className="block font-display text-2xl font-extrabold text-pine-dark">Since 2025</strong><span className="text-xs font-semibold text-ink/45">Verified listing</span></div></div></div><div className="hero-visual relative mx-auto w-full max-w-[650px]"><div className="hero-shape ml-auto aspect-[.94] w-[91%] overflow-hidden bg-sage soft-shadow"><img src={images.hero} alt="Rehabilitation professional supporting a patient" className="h-full w-full object-cover"/></div><div className="float-a absolute -left-1 top-[14%] rounded-[22px] bg-white/95 p-4 shadow-xl backdrop-blur sm:-left-5 sm:p-5"><div className="flex items-center gap-3"><span className="grid h-11 w-11 place-items-center rounded-2xl bg-sage-soft text-pine"><Icon name="heart"/></span><div><strong className="block text-sm text-pine-dark">Homely recovery</strong><span className="text-[11px] text-ink/42">Dignified, attentive care</span></div></div></div><div className="float-b absolute -bottom-5 right-0 max-w-[235px] rounded-[22px] bg-saffron p-5 text-white shadow-xl sm:right-8"><div className="mb-2 flex items-center gap-2 text-[10px] font-extrabold uppercase tracking-[.17em] text-white/70"><Icon name="clock" size={15}/>Always supported</div><strong className="font-display text-xl font-extrabold">Dedicated nursing, day and night</strong></div><div className="absolute -bottom-4 left-[10%] -z-10 h-28 w-28 rounded-[42%] border-[17px] border-pine/15"></div></div></div></section>;
    }

    function TrustStrip(){const items=[["shield","24/7 nursing","Continuous support"],["heart","Neuro specialists","Recovery-focused team"],["check","Hygienic facility","Clean & maintained"],["star","5.0 rating","Patient-reported care"]];return <section className="bg-pine text-white"><div className="mx-auto grid max-w-[1400px] grid-cols-2 lg:grid-cols-4">{items.map(([ic,t,s],i)=><div key={t} className={`flex items-center gap-4 border-white/12 px-5 py-8 sm:px-8 ${i%2?"border-l":""} ${i>1?"border-t lg:border-t-0":""} ${i>0?"lg:border-l":""}`}><Icon name={ic} size={26} className="shrink-0 text-[#f1b77e]"/><div><strong className="block text-sm font-bold sm:text-base">{t}</strong><span className="text-xs text-white/52">{s}</span></div></div>)}</div></section>}

    function PackageCard({item,add}){return <article className="catalog-card flex h-full flex-col overflow-hidden rounded-[28px] border border-pine/10 bg-white"><div className="relative h-52 overflow-hidden"><img src={item.image} alt={item.name} className="photo-zoom h-full w-full object-cover"/><div className="absolute inset-0 bg-gradient-to-t from-pine-dark/55 via-transparent to-transparent"></div><span className="absolute left-5 top-5 rounded-full bg-white/90 px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-wider text-pine backdrop-blur">{item.badge}</span></div><div className="flex flex-1 flex-col p-6"><div className="text-[10px] font-extrabold uppercase tracking-[.17em] text-saffron">{item.category}</div><h3 className="mt-2 text-xl font-extrabold leading-snug text-pine-dark">{item.name}</h3><p className="mt-3 text-sm leading-6 text-ink/52">{item.desc}</p><ul className="mt-5 space-y-2">{item.includes.slice(0,4).map(x=><li key={x} className="flex items-center gap-2 text-xs font-semibold text-ink/58"><span className="grid h-5 w-5 place-items-center rounded-full bg-sage-soft text-pine"><Icon name="check" size={11} strokeWidth={2.5}/></span>{x}</li>)}</ul><div className="mt-auto pt-6"><div className="flex items-end justify-between border-t border-pine/10 pt-5"><div><span className="text-[10px] text-ink/38">Illustrative package rate</span><div className="font-display text-2xl font-extrabold text-pine-dark">{formatMoney(item.price)}</div></div><span className="rounded-lg bg-sage-soft px-2.5 py-1.5 text-[10px] font-extrabold text-pine">GST ₹0*</span></div><Button onClick={()=>add(item,1)} className="mt-5 w-full"><Icon name="cart" size={17}/>Add package</Button></div></div></article>}

    function ProductCard({item,add}){const [qty,setQty]=useState(1);return <article className="catalog-card flex h-full flex-col rounded-[26px] border border-pine/10 bg-white p-6"><div className="flex items-start justify-between gap-4"><span className="grid h-13 w-13 place-items-center rounded-2xl bg-sage-soft text-2xl text-pine">{symbols[item.icon]}</span><span className={`rounded-full px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-wider ${item.taxRate?"bg-[#fff0df] text-[#9a5a1f]":"bg-sage-soft text-pine"}`}>{item.badge}</span></div><div className="mt-5 text-[10px] font-extrabold uppercase tracking-[.16em] text-saffron">{item.category}</div><h3 className="mt-2 text-xl font-extrabold text-pine-dark">{item.name}</h3><p className="mt-3 text-sm leading-6 text-ink/52">{item.desc}</p><ul className="mt-5 space-y-2">{item.features.map(x=><li key={x} className="flex items-center gap-2 text-xs font-semibold text-ink/55"><span className="text-saffron">•</span>{x}</li>)}</ul><div className="mt-auto pt-6"><div className="flex items-end justify-between border-t border-pine/10 pt-5"><div><span className="text-[10px] text-ink/38">Illustrative rate</span><div className="font-display text-2xl font-extrabold text-pine-dark">{formatMoney(item.price)}<span className="text-xs font-semibold text-ink/38"> / {item.unit}</span></div></div><div className="flex items-center rounded-full border border-pine/15"><button onClick={()=>setQty(q=>Math.max(1,q-1))} className="grid h-9 w-9 place-items-center text-pine" aria-label="Decrease"><Icon name="minus" size={14}/></button><span className="w-8 text-center text-sm font-bold">{qty}</span><button onClick={()=>setQty(q=>q+1)} className="grid h-9 w-9 place-items-center text-pine" aria-label="Increase"><Icon name="plus" size={14}/></button></div></div><Button onClick={()=>{add(item,qty);setQty(1)}} className="mt-5 w-full"><Icon name="cart" size={17}/>Add {qty} {unitLabel(item.unit,qty)}</Button></div></article>}

    function PackagesPreview({add}){return <section className="px-5 py-20 sm:px-8 lg:px-12 lg:py-28"><div className="mx-auto max-w-[1400px]"><div className="section-reveal mb-12 flex flex-col justify-between gap-6 md:flex-row md:items-end"><div><Eyebrow>Residential recovery plans</Eyebrow><h2 className="max-w-3xl text-balance text-4xl font-extrabold leading-tight text-pine-dark sm:text-5xl">Care pathways,<br/>thoughtfully put together.</h2></div><button onClick={()=>go("packages")} className="group flex items-center gap-2 self-start text-sm font-bold text-pine">View all packages <span className="grid h-9 w-9 place-items-center rounded-full border border-pine/20 transition group-hover:bg-pine group-hover:text-white"><Icon name="arrow" size={16}/></span></button></div><div className="grid gap-5 md:grid-cols-2 xl:grid-cols-3">{packages.slice(0,3).map(x=><div className="section-reveal" key={x.id}><PackageCard item={x} add={add}/></div>)}</div></div></section>}

    function CareSection(){return <section className="overflow-hidden bg-pine-dark px-5 py-20 text-white sm:px-8 lg:px-12 lg:py-28"><div className="mx-auto grid max-w-[1400px] items-center gap-14 lg:grid-cols-[.95fr_1.05fr] lg:gap-24"><div className="section-reveal relative"><div className="overflow-hidden rounded-[36px]"><img src={images.care} alt="Attentive nursing and rehabilitation support" className="aspect-[1.08] w-full object-cover"/></div><div className="absolute -bottom-6 right-0 rounded-[22px] bg-saffron p-5 shadow-xl sm:right-6"><span className="block font-display text-3xl font-extrabold">24 / 7</span><span className="text-xs text-white/72">nursing & bedside care</span></div></div><div className="section-reveal"><Eyebrow light>More than clinical routines</Eyebrow><h2 className="text-balance text-4xl font-extrabold leading-tight sm:text-5xl">A place that feels like care, not confinement.</h2><p className="mt-6 text-base leading-7 text-white/60">Patients describe a clean, pleasant environment with a homely feeling. Dedicated nurses, neuro-physiotherapists and medical attendants work together around practical recovery goals and day-to-day dignity.</p><div className="mt-8 grid gap-4 sm:grid-cols-2">{[["Neuro recovery","Post-stroke and neurological rehabilitation."],["Clinical physiotherapy","Guided movement, strength and pain care."],["Psychosocial support","Structured care in a supportive environment."],["Bedside nursing","General inpatient and daily living assistance."]].map(([t,b])=><div key={t} className="rounded-2xl border border-white/10 bg-white/[.05] p-5"><span className="text-xl text-[#f1b77e]">✦</span><h3 className="mt-3 text-base font-extrabold">{t}</h3><p className="mt-2 text-xs leading-5 text-white/45">{b}</p></div>)}</div><Button onClick={()=>go("services")} variant="warm" className="mt-8">Build your stay <Icon name="arrow" size={17}/></Button></div></div></section>}

    function ReviewSection(){return <section className="bg-sage-soft/65 px-5 py-20 sm:px-8 lg:px-12 lg:py-24"><div className="mx-auto max-w-[1400px]"><div className="section-reveal mb-12 flex flex-col justify-between gap-6 md:flex-row md:items-end"><div><Eyebrow>Patient voices</Eyebrow><h2 className="text-4xl font-extrabold text-pine-dark sm:text-5xl">Recovery, remembered warmly.</h2></div><div><div className="font-display text-4xl font-extrabold text-pine">5.0 <span className="text-lg text-saffron">★★★★★</span></div><p className="text-xs text-ink/42">Based on 10+ listing reviews</p></div></div><div className="grid gap-5 md:grid-cols-2 xl:grid-cols-4">{reviews.map(r=><article key={r.name} className="section-reveal rounded-[25px] bg-white p-6 card-shadow"><span className="text-3xl text-saffron">“</span><p className="mt-4 text-sm leading-6 text-ink/62">{r.text}</p><div className="mt-6 border-t border-pine/10 pt-4"><strong className="block text-sm text-pine-dark">{r.name}</strong><span className="text-[10px] text-ink/38">5.0 ★ · {r.time}</span></div></article>)}</div></div></section>}

    function CTA(){return <section className="px-5 py-16 sm:px-8 lg:px-12 lg:py-20"><div className="section-reveal relative mx-auto max-w-[1400px] overflow-hidden rounded-[36px] bg-saffron px-7 py-12 text-white sm:px-12 lg:px-16 lg:py-16"><div className="absolute -right-20 -top-28 h-80 w-80 rounded-full border-[55px] border-white/10"></div><div className="absolute -bottom-24 left-[42%] h-56 w-56 rounded-full bg-[#c87836]"></div><div className="relative flex flex-col justify-between gap-8 lg:flex-row lg:items-center"><div><div className="mb-4 text-[10px] font-extrabold uppercase tracking-[.2em] text-white/68">Your next step can start today</div><h2 className="max-w-3xl text-balance text-3xl font-extrabold leading-tight sm:text-5xl">A calmer path back<br/>to everyday life.</h2></div><div className="flex shrink-0 flex-wrap gap-3"><Button onClick={()=>go("packages")} variant="white">Choose a care plan <Icon name="arrow" size={17}/></Button><a href={`tel:+91${PHONE_1}`} className="inline-flex min-h-12 items-center gap-2 rounded-full border border-white/30 px-6 text-sm font-bold text-white transition hover:bg-white/10"><Icon name="phone" size={17}/>{PHONE_1}</a></div></div></div></section>}

    function HomePage({add}){return <main><RateNotice/><Hero/><TrustStrip/><PackagesPreview add={add}/><CareSection/><ReviewSection/><CTA/></main>}

    function PackagesPage({add}){return <main><RateNotice/><PageHero eyebrow="Recovery packages" title="Residential care plans with room, therapy and support bundled in." text="Choose a starting plan and add any extra room days, meals, sessions or bedside support separately. All rates are illustrative until confirmed by the centre."/><section className="px-5 py-16 sm:px-8 lg:px-12 lg:py-24"><div className="mx-auto max-w-[1400px]"><div className="grid gap-5 md:grid-cols-2 xl:grid-cols-3">{packages.map(x=><div className="page-enter" key={x.id}><PackageCard item={x} add={add}/></div>)}</div><div className="mt-12 rounded-[28px] border border-[#e3c497] bg-[#fff6e8] p-6 sm:p-8"><div className="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between"><div className="flex items-start gap-4"><span className="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-white text-saffron"><Icon name="info"/></span><div><h2 className="text-lg font-extrabold text-pine-dark">Need a different duration?</h2><p className="mt-1 max-w-2xl text-xs leading-5 text-ink/52">Build a custom stay using day-based rooms, nursing, meals and individual therapy sessions. Quantities remain editable in your cart.</p></div></div><Button onClick={()=>go("services")} variant="outline" className="shrink-0">Build custom stay <Icon name="arrow" size={16}/></Button></div></div></div></section><CTA/></main>}

    function ServicesPage({add}){const [query,setQuery]=useState("");const [cat,setCat]=useState("All");const cats=["All",...new Set(products.map(x=>x.category))];const shown=products.filter(x=>(cat==="All"||x.category===cat)&&x.name.toLowerCase().includes(query.toLowerCase()));return <main><RateNotice/><PageHero eyebrow="Services & add-ons" title="Build a rehab stay around the care actually needed." text="Set room days, therapy sessions, nursing days, food plans and convenience add-ons. GST is shown only for items marked taxable in this prototype."/><section className="px-5 py-14 sm:px-8 lg:px-12 lg:py-20"><div className="mx-auto max-w-[1400px]"><div className="mb-10 flex flex-col gap-5 rounded-[25px] border border-pine/10 bg-white p-4 sm:p-5 lg:flex-row lg:items-center lg:justify-between"><label className="relative block w-full lg:max-w-sm"><span className="sr-only">Search services</span><Icon name="search" size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-pine/45"/><input value={query} onChange={e=>setQuery(e.target.value)} className="input-field pl-11" placeholder="Search rooms, therapy, meals..."/></label><div className="hide-scrollbar flex gap-2 overflow-x-auto">{cats.map(c=><button key={c} onClick={()=>setCat(c)} className={`whitespace-nowrap rounded-full px-4 py-2.5 text-xs font-bold transition ${cat===c?"bg-pine text-white":"bg-sage-soft text-ink/55 hover:text-pine"}`}>{c}</button>)}</div></div><div className="mb-7 text-sm font-semibold text-ink/42">Showing {shown.length} configurable item{shown.length===1?"":"s"}</div>{shown.length?<div className="grid gap-5 md:grid-cols-2 xl:grid-cols-3">{shown.map(x=><div className="page-enter" key={x.id}><ProductCard item={x} add={add}/></div>)}</div>:<div className="rounded-3xl bg-white py-20 text-center"><span className="text-4xl">⌕</span><h2 className="mt-4 text-2xl font-extrabold text-pine-dark">No matching items</h2><p className="mt-2 text-sm text-ink/42">Try another service name or category.</p></div>}<div className="mt-12 rounded-2xl bg-sage-soft p-5 text-xs leading-5 text-ink/55"><strong className="text-pine-dark">GST note:</strong> An illustrative 5% GST is calculated only on catalog items labeled “taxable*”. Actual applicability, exemptions and rates must be confirmed on the centre's final invoice.</div></div></section></main>}

    function FacilityPage(){const items=[["Neurophysiotherapy","Specialized support for neurological and post-stroke recovery."],["Clinical physiotherapy","Assessment-led mobility, strength and pain-management sessions."],["24/7 nursing","Dedicated nursing staff and bedside care around the clock."],["Homely environment","Clean, hygienic spaces designed to feel calm and familiar."]];return <main><PageHero eyebrow="Facility & environment" title="Serious rehabilitation in a setting that still feels human." text="A focused recovery environment with skilled neuro-physiotherapists, nursing staff and medical attendants available across inpatient care needs."/><section className="px-5 py-20 sm:px-8 lg:px-12 lg:py-24"><div className="mx-auto grid max-w-[1400px] items-center gap-14 lg:grid-cols-2 lg:gap-20"><div className="section-reveal grid grid-cols-2 gap-4"><div className="photo-card col-span-2 overflow-hidden rounded-[30px]"><img src={images.physio} alt="Physiotherapy and movement rehabilitation" className="photo-zoom aspect-[1.7] w-full object-cover"/></div><div className="photo-card overflow-hidden rounded-[24px]"><img src={images.room} alt="Clean inpatient environment" className="photo-zoom aspect-square w-full object-cover"/></div><div className="photo-card overflow-hidden rounded-[24px]"><img src={images.elderly} alt="Supportive recovery care" className="photo-zoom aspect-square w-full object-cover"/></div></div><div className="section-reveal"><Eyebrow>Built around recovery</Eyebrow><h2 className="text-4xl font-extrabold leading-tight text-pine-dark sm:text-5xl">The right people. The right rhythm. Every day.</h2><p className="mt-6 text-base leading-7 text-ink/60">Recovery can be physical, neurological, emotional and deeply personal. Sri Thirumala brings these needs into one supervised environment with clinical attention and practical daily support.</p><div className="mt-8 grid gap-4 sm:grid-cols-2">{items.map(([t,b])=><article key={t} className="rounded-2xl border b     function AboutPage(){return <main><PageHero eyebrow="About Sri Thirumala" title="A young facility with a deeply attentive approach to recovery." text="Established in 2025, Sri Thirumala Rehab Center & Nursing Home is a verified business listing serving Prakash Nagar and the wider Khammam community."/><section className="px-5 py-20 sm:px-8 lg:px-12 lg:py-28"><div className="mx-auto grid max-w-[1400px] items-center gap-14 lg:grid-cols-2 lg:gap-24"><div className="section-reveal relative"><div className="hero-shape overflow-hidden"><img src={images.elderly} alt="Patient receiving supportive rehabilitation care" className="aspect-square w-full object-cover"/></div><div className="absolute -bottom-5 right-2 rounded-2xl bg-saffron p-5 text-white shadow-xl sm:right-8"><span className="block font-display text-3xl font-extrabold">5.0 ★</span><span className="text-xs text-white/72">overall listing rating</span></div></div><div className="section-reveal"><Eyebrow>Our profile</Eyebrow><h2 className="text-4xl font-extrabold leading-tight text-pine-dark sm:text-5xl">Recovery expertise, delivered with everyday kindness.</h2><p className="mt-6 text-base leading-7 text-ink/62">The centre focuses on neurological rehabilitation, physiotherapy and inpatient nursing. Patient feedback repeatedly highlights kind doctors and physiotherapists, attentive management, speedy support and a pleasant, homely climate.</p><p className="mt-4 text-base leading-7 text-ink/62">Reviews also mention reasonable pricing and subsidy support. Eligibility and final coverage should always be confirmed directly with the centre before admission.</p><div className="mt-8 flex items-center gap-4 rounded-2xl bg-sage-soft p-5"><span className="grid h-12 w-12 shrink-0 place-items-center rounded-full bg-white text-pine"><Icon name="shield"/></span><div><strong className="block text-sm font-extrabold text-pine-dark">Verified / claimed listing</strong><span className="text-xs leading-5 text-ink/45">Operating 24 hours     function ContactPage(){const [sent,setSent]=useState(false);const submit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));try{const old=JSON.parse(localStorage.getItem("thirumalaEnquiries"))||[];localStorage.setItem("thirumalaEnquiries",JSON.stringify([...old,{...data,createdAt:new Date().toISOString()}]))}catch{}e.currentTarget.reset();setSent(true)};return <main><PageHero eyebrow="Contact & admissions" title="Talk to a care team that is available around the clock." text="Call for current availability, an assessment discussion, official tariffs, subsidy eligibility or directions to the Prakash Nagar facility."/><section className="px-5 py-20 sm:px-8 lg:px-12 lg:py-24"><div className="mx-auto grid max-w-[1200px] gap-7 lg:grid-cols-[.8fr_1.2fr]"><div className="space-y-5"><article className="section-reveal rounded-[27px] bg-pine p-7 text-white"><span className="grid h-12 w-12 place-items-center rounded-2xl bg-white/10"><Icon name="clock"/></span><h2 className="mt-6 text-2xl font-extrabold">Open 24 / 7</h2><p className="mt-2 text-sm text-white/55">Monday through Sunday, 12:00 AM–11:59 PM.</p></article><article className="section-reveal rounded-[27px] border border-pine/10 bg-white p-7"><Icon name="phone" className="text-saffron" size={26}/><h2 className="mt-5 text-xl font-extrabold text-pine-dark">Speak with the centre</h2><div className="mt-4 space-y-2"><a href={`tel:+91${PHONE_1}`} className="block text-lg font-bold text-pine">+91 {PHONE_1}</a><a href={`tel:+91${PHONE_2}`} className="block text-lg font-bold text-pine">+91 {PHONE_2}</a></div></article><article className="section-reveal rounded-[27px] border border-pine/10 bg-white p-7"><Icon name="pin" className="text-saffron" size={26}/><h2 className="mt-5 text-xl font-extrabold text-pine-dark">Prakash Nagar, Khammam</h2><p className="mt-3 text-sm leading-6 text-ink/55">{ADDRESS}</p><a href={MAP_URL} target="_blank" rel="noreferrer" className="mt-5 inline-flex items-center gap-     function calculate(cart){const subtotal=cart.reduce((s,x)=>s+x.price*x.qty,0);const gst=cart.reduce((s,x)=>s+x.price*x.qty*(x.taxRate||0)/100,0);return{subtotal,gst,total:subtotal+gst}}

    function CartPage({cart,change,remove}){const totals=calculate(cart);const recommendations=products.filter(p=>!cart.some(x=>x.id===p.id)).slice(0,3);if(!cart.length)return <main><RateNotice/><PageHero eyebrow="Your cart" title="Build a recovery stay, one need at a time."/><section className="px-5 py-24 text-center"><div className="mx-auto max-w-md"><span className="mx-auto grid h-20 w-20 place-items-center rounded-full bg-sage-soft text-pine"><Icon name="cart" size={34}/></span><h2 className="mt-7 text-3xl font-extrabold text-pine-dark">Your cart is empty</h2><p className="mt-3 text-sm leading-6 text-ink/48">Start with a bundled recovery package or create a custom stay from rooms, therapy, care and meals.</p><div className="mt-7 flex flex-wrap justify-center gap-3"><Button onClick={()=>go("packages")}>Browse packages</Button><Button onClick={()=>go("services")} variant="outline">Build custom stay</Button></div></div></section></main>;return <main><RateNotice/><PageHero eyebrow="Your cart" title="Review the care, stay and support selected." text="Every duration remains editable. GST is calculated per marked item and all prices remain estimates until confirmed by the centre."/><section className="px-5 py-16 sm:px-8 lg:px-12 lg:py-20"><div className="mx-auto grid max-w-[1240px] gap-8 lg:grid-cols-[1.38fr_.62fr]"><div><div className="space-y-4">{cart.map(x=><article key={x.id} className="page-enter flex flex-col gap-5 rounded-[23px] border border-pine/10 bg-white p-5 sm:flex-row sm:items-center"><span className="grid h-14 w-14 shrink-0 place-items-center overflow-hidden rounded-2xl bg-sage-soft text-xl text-pine">{x.kind==="package"?<img src={x.image} className="h-full w-full object-cover" alt=""/>:symbols[x.icon]}</span><div className="min-w-0 flex-1"><div className="text-[10px] font-extrabold uppercase tracking-wider text-saffron">{x.category}</div><h2 className="mt-1 text-lg font-extrabold text-pine-dark">{x.name}</h2><div className="mt-1 text-sm font-bold text-p     function downloadReceipt(order){const {jsPDF}=window.jspdf;const doc=new jsPDF();const money=n=>`INR ${Math.round(n).toLocaleString("en-IN")}`;doc.setFillColor(22,79,82);doc.rect(0,0,210,42,"F");doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text("SRI THIRUMALA REHAB CENTER",16,18);doc.setFontSize(9);doc.setFont("helvetica","normal");doc.text("Rehab Center & Nursing Home | Booking Estimate",16,27);doc.text(`Receipt ${order.id}`,16,34);doc.setTextColor(37,59,61);doc.setFontSize(10);doc.text(`Generated: ${new Date(order.createdAt).toLocaleString("en-IN")}`,16,53);doc.text(`Patient: ${order.patient}`,16,60);doc.text(`Contact: ${order.phone}`,16,67);doc.text(`Planned start: ${new Date(order.date+"T00:00:00").toLocaleDateString("en-IN")}`,16,74);doc.setDrawColor(205,223,210);doc.line(16,81,194,81);doc.setFont("helvetica","bold");doc.text("ITEM",16,90);doc.text("QTY",128,90);doc.text("RATE",145,90);doc.text("AMOUNT",174,90);doc.setFont("helvetica","normal");let y=99;order.items.forEach((x,i)=>{if(y>260){doc.addPage();y=22}const name=doc.splitTextToSize(x.name,103);doc.text(name,16,y);doc.text(String(x.qty),130,y);doc.text(money(x.price),145,y);doc.text(money(x.price*x.qty),174,y);if(x.taxRate)doc.text(`GST ${x.taxRate}% marked`,16,y+5);y+=Math.max(12,name.length*5+5)});if(y>232){doc.addPage();y=22}doc.line(16,y,194,y);y+=9;doc.setFont("helvetica","bold");doc.text("Subtotal",133,y);doc.text(money(order.subtotal),174,y);y+=7;doc.text("Illustrative GST",133,y);doc.text(money(order.gst),174,y);y+=9;doc.setFontSize(12);doc.text("Estimated total",122,y);doc.text(money(order.total),174,y);y+=16;doc.setFontSize(8);doc.setFont("helvetica","normal");const note="BOOKING ESTIMATE - NOT A TAX INVOICE. Rates, room allocation, clinical suitability, subsidies and tax treatment must be confirmed by Sri Thirumala Rehab Center before admission. No online payment was captured by this prototype.";doc.text(doc.splitTextToSize(note,178),16,y);doc.save(`${order.id}-booking-receipt.pdf`)}

    function CheckoutPage({cart,complete}){const [order,setOrder]=useState(null);const [method,setMethod]=useState("centre");const totals=calculate(cart);const minDate=new Date().toISOString().split("T")[0];const submit=e=>{e.preventDefault();const d=new FormData(e.currentTarget);const result={id:`STR-${Date.now().toString().slice(-8)}`,patient:d.get("patient"),customer:d.get("customer"),phone:d.get("phone"),email:d.get("email"),date:d.get("date"),method,items:cart.map(x=>({...x})),...totals,createdAt:new Date().toISOString()};try{const old=JSON.parse(localStorage.getItem("thirumalaOrders"))||[];localStorage.setItem("thirumalaOrders",JSON.stringify([...old,result]));localStorage.setItem("thirumalaLastOrder",JSON.stringify(result))}catch{}setOrder(result);complete();scrollTo(0,0)};if(order)return <main className="min-h-[75vh] px-5 py-16 sm:px-8"><div className="receipt-shell mx-auto max-w-3xl rounded-[34px] bg-white p-7 soft-shadow sm:p-12"><div className="text-center"><span className="success-pop mx-auto grid h-24 w-24 place-items-center rounded-full bg-sage-soft text-pine"><Icon name="check" size={44} strokeWidth={2.5}/></span><div className="mt-7 text-xs font-extrabold uppercase tracking-[.2em] text-saffron">Booking estimate created</div><h1 className="mt-3 text-balance text-4xl font-extrabold text-pine-dark">Your recovery plan is ready.</h1><p className="mx-auto mt-4 max-w-xl text-sm leading-6 text-ink/55">Reference <strong className="text-pine">{order.id}</strong> has been saved. Contact the centre to confirm admission, clinical suitability, official pricing and payment.</p></div><div className="mt-9 rounded-2xl border border-pine/10"><div className="flex flex-col gap-2 border-b border-pine/10 bg-sage-soft p-5 sm:flex-row sm:justify-between"><div><span className="text-[10px] font-bold uppercase tracking-wider text-ink/40">Patient</span><strong className="mt-1 block text-sm text-pine-dark">{order.patient}</strong></div><div className="sm:text-right"><span classNa xt-center"><Button onClick={()=>go("packages")}>Browse packages</Button></div></main>;return <main><RateNotice/><PageHero eyebrow="Checkout" title="Confirm the patient and planned admission details." text="This creates a downloadable booking estimate. No payment is captured; the centre confirms official pricing, availability and clinical suitability."/><form onSubmit={submit} className="px-5 py-16 sm:px-8 lg:px-12 lg:py-20"><div className="mx-auto grid max-w-[1240px] gap-8 lg:grid-cols-[1.15fr_.85fr]"><div className="space-y-6"><section className="rounded-[27px] border border-pine/10 bg-white p-6 sm:p-8"><div className="mb-7 flex items-center gap-3"><span className="grid h-10 w-10 place-items-center rounded-full bg-sage-soft text-pine"><Icon name="user"/></span><div><div className="text-[10px] font-extrabold uppercase tracking-wider text-saffron">Step 1</div><h2 className="text-xl font-extrabold text-pine-dark">Patient & contact</h2></div></div><div className="grid gap-5 sm:grid-cols-2"><label className="text-xs font-bold text-ink/58">Patient name<input name="patient" required className="input-field mt-2" placeholder="Patient's full name"/></label><label className="text-xs font-bold text-ink/58">Contact person<input name="customer" required className="input-field mt-2" placeholder="Family / caregiver name"/></label><label className="text-xs font-bold text-ink/58">Mobile number<input name="phone" required pattern="[0-9 +()-]{7,15}" className="input-field mt-2" placeholder="Phone number"/></label><label className="text-xs font-bold text-ink/58">Email<input name="email" required type="email" className="input-field mt-2" placeholder="Receipt email"/></label><label className="text-xs font-bold text-ink/58">Patient age<input name="age" required type="number" min="1" max="120" className="input-field mt-2" placeholder="Age"/></label><label className="text-xs font-bold text-ink/58">Planned start date<input name="date" required type="date" min={minDate} className="input-field mt-2"/></label></div></section><section className="rounded-[27px] border border-pine/10 bg-white p-6 sm:p-8"><div className="mb-7 flex items-center gap-3"><span className="grid h-10 w-10 place-items-center rounded-full bg-sage-soft text-pine"><Icon name="lock"/></span><div><div className="text-[10px] font-extrabold uppercase tracking-wider text-saffron">Step 2</div><h2 className="text-xl font-extrabold text-pine-dark">Payment preference</h2></div></div><div className="grid gap-3 sm:grid-cols-2">{[["centre","Pay at the centre","Confirm the bill during admission."],["link","Request secure payment link","Ask the team to share payment options."]].map(([v,t,b])=><label key={v} className={`cursor-pointer rounded-2xl border p-5 transition ${method===v?"border-pine bg-sage-soft":"border-pine/10"}`}><div className="flex items-start gap-3"><input type="radio" checked={method===v} onChange={()=>setMethod(v)} className="mt-1 accent-[#164f52]"/><span><strong className="block text-sm text-pine-dark">{t}</strong><span className="mt-1 block text-xs leading-5 text-ink/45">{b}</span></span></div></label>)}</div><label className="mt-5 block text-xs font-bold text-ink/58">Care note (optional)<textarea name="note" className="input-field mt-2 min-h-24 resize-y" placeholder="Mobility, diet, attendant or room preferences..."></textarea></label></section></div><aside className="h-fit rounded-[28px] bg-pine-dark p-7 text-white lg:sticky lg:top-32"><h2 className="text-2xl font-extrabold">Booking summary</h2><div className="mt-6 max-h-[360px] space-y-4 overflow-auto pr-1">{cart.map(x=><div key={x.id} className="flex gap-3 border-b border-white/10 pb-4"><span className="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-white/10 text-sm">{x.kind==="package"?"✦":symbols[x.icon]}</span><div className="min-w-0 flex-1"><div className="text-xs font-bold leading-5">{x.name}</div><span className="text-[10px] text-white/38">{x.qty} {unitLabel(x.unit,x.qty)}</span></div><span className="text-xs font-bold">{formatMoney(x.price*x.qty)}</span></div>)}</div><div className="mt-6 space-y-2 border-b border-white/10 pb-5 text-sm"><div className="flex justify-between text-white/50"><span>Subtotal</span><span>{formatMoney(totals.subtotal)}</span></div><div className="flex justify-between text-white/50"><span>Illustrative GST</span><span>{formatMoney(totals.gst)}</span></div></div><div className="flex items-end justify-between py-6"><span className="text-sm text-white/62">Estimated total</span><strong className="text-3xl">{formatMoney(totals.total)}</strong></div><label className="flex items-start gap-3 text-[11px] leading-5 text-white/50"><input required type="checkbox" className="mt-1 accent-[#d9893d]"/><span>I understand this is an estimate, not confirmed admission or a tax invoice.</span></label><Button type="submit" variant="warm" className="mt-6 w-full">Create booking & receipt <Icon name="arrow" size={17}/></Button><div className="mt-4 flex items-center justify-center gap-2 text-[10px] text-white/32"><Icon name="lock" size={13}/>Order stored locally in this browser.</div></aside></div></form></main>}

    function Footer(){return <footer className="bg-pine-dark px-5 pb-8 pt-16 text-white sm:px-8 lg:px-12"><div className="mx-auto max-w-[1400px]"><div className="grid gap-12 border-b border-white/10 pb-12 md:grid-cols-2 lg:grid-cols-[1.5fr_1fr_1fr_1.3fr]"><div><button onClick={()=>go("home")} className="flex items-center gap-3 text-left"><Logo/><div><div className="font-display text-lg font-extrabold">Sri Thirumala</div><div className="text-[9px] font-bold uppercase tracking-[.15em] text-white/42">Rehab Center & Nursing Home</div></div></button><p className="mt-5 max-w-sm text-sm leading-6 text-white/44">Neurological rehabilitation, physiotherapy and nursing care in a calm, homely environment in Khammam.</p><div className="mt-5 inline-flex items-center gap-2 rounded-full bg-white/[.06] px-4 py-2 text-xs font-bold"><span className="h-2 w-2 rounded-full bg-[#78d39a]"></span>Open 24 / 7</div></div><div><h3 className="text-sm font-extrabold">Explore</h3><div className="mt-5 flex flex-col items-start gap-3">{[["packages","Recovery packages"],["services","Rooms & services"],["facility","Facility"],["about","About us"]].map(([p,l])=><button key={p} onClick={()=>go(p)} className="text-xs text-white/42 hover:text-[#f1b77e]">{l}</button>)}</div></div><div><h3 className="text-sm font-extrabold">Connect</h3><div className="mt-5 flex flex-col items-start gap-3"><a href={`tel:+91${PHONE_1}`} className="text-xs text-white/42 hover:text-[#f1b77e]">+91 {PHONE_1}</a><a href={`tel:+91${PHONE_2}`} className="text-xs text-white/42 hover:text-[#f1b77e]">+91 {PHONE_2}</a><a href={FACEBOOK_URL} target="_blank" rel="noreferrer" className="text-xs text-white/42 hover:text-[#f1b77e]">Facebook profile</a><button onClick={()=>go("cart")} className="text-xs text-white/42 hover:text-[#f1b77e]">Your cart</button></div></div><div><h3 className="text-sm font-extrabold">Find us</h3><p className="mt-5 text-xs leading-5 text-white/42">{ADDRESS}</p><a href={MAP_URL} target="_blank" rel="noreferrer" className="mt-4 inline-flex items-center gap-2 text-xs font-bold text-[#f1b77e]"><Icon name="pin" size={15}/>Open directions</a></div></div><div className="flex flex-col gap-3 pt-7 text-[10px] text-white/27 sm:flex-row sm:justify-between"><span>© {new Date().getFullYear()} Sri Thirumala Rehab Center & Nursing Home.</span><span>Displayed prices are illustrative. This website does not replace medical assessment or an official invoice.</span></div></div></footer>}

    function App(){const route=useRoute();const [cart,setCart]=useState(()=>{try{return JSON.parse(localStorage.getItem("thirumalaCart"))||[]}catch{return[]}});const [toast,setToast]=useState("");useEffect(()=>{try{localStorage.setItem("thirumalaCart",JSON.stringify(cart))}catch{}},[cart]);useEffect(()=>{scrollTo(0,0);const ctx=gsap.context(()=>{gsap.fromTo(".page-enter",{opacity:0,y:25},{opacity:1,y:0,duration:.7,stagger:.06,ease:"power3.out"});gsap.fromTo(".hero-copy > *",{opacity:0,y:26},{opacity:1,y:0,duration:.8,stagger:.1,ease:"power3.out"});gsap.fromTo(".hero-visual",{opacity:0,x:30,scale:.95},{opacity:1,x:0,scale:1,duration:1.05,ease:"power3.out"});document.querySelectorAll(".section-reveal").forEach(el=>gsap.fromTo(el,{opacity:0,y:34},{opacity:1,y:0,duration:.8,ease:"power3.out",scrollTrigger:{trigger:el,start:"top 88%",once:true}}));requestAnimationFrame(()=>ScrollTrigger.refresh())});return()=>ctx.revert()},[route]);useEffect(()=>{if(!window.Lenis)return;const lenis=new Lenis({duration:1.05,smoothWheel:true,wheelMultiplier:.9});lenis.on("scroll",ScrollTrigger.update);let raf;const tick=t=>{lenis.raf(t);raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick);return()=>{cancelAnimationFrame(raf);lenis.destroy()}},[]);
      const add=(item,qty=1)=>{setCart(c=>{const f=c.find(x=>x.id===item.id);return f?c.map(x=>x.id===item.id?{...x,qty:x.qty+qty}:x):[...c,{...item,qty}]});setToast(`${item.name} added to cart`);setTimeout(()=>setToast(""),2500)};
      const change=(id,d,item)=>{if(id==="__add__"&&item){add(item,1);return}setCart(c=>c.map(x=>x.id===id?{...x,qty:Math.max(1,x.qty+d)}:x))};const remove=id=>setCart(c=>c.filter(x=>x.id!==id));const count=cart.reduce((s,x)=>s+x.qty,0);
      const pages={home:<HomePage add={add}/>,packages:<PackagesPage add={add}/>,services:<ServicesPage add={add}/>,facility:<FacilityPage/>,about:<AboutPage/>,contact:<ContactPage/>,cart:<CartPage cart={cart} change={change} remove={remove}/>,checkout:<CheckoutPage cart={cart} complete={()=>setCart([])}/>};
      return <><Header route={route} count={count}/>{pages[route]||pages.home}<Footer/>{toast&&<div role="status" className="toast-in fixed bottom-6 left-1/2 z-[80] flex -translate-x-1/2 items-center gap-3 whitespace-nowrap rounded-full bg-pine-dark px-5 py-3 text-sm font-bold text-white shadow-2xl"><span className="grid h-6 w-6 place-items-center rounded-full bg-saffron"><Icon name="check" size={14}/></span>{toast}<button onClick={()=>go("cart")} className="ml-2 text-xs text-[#f1b77e] underline underline-offset-4">View cart</button></div>}</>}
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
